services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: battleship
      POSTGRES_PASSWORD: battleship
      POSTGRES_DB: battleship
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battleship -d battleship"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://battleship:battleship@db:5432/battleship?sslmode=disable
      SESSION_SECRET: local-dev-session-secret-not-for-production
      PUBLIC_URL: http://localhost:8080
      # Google sign-in is optional locally: put the OAuth client in .env to try it.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEV_LOGIN: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db-data:

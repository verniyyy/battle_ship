services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: battleship
      POSTGRES_PASSWORD: battleship
      POSTGRES_DB: battleship
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battleship -d battleship"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://battleship:battleship@db:5432/battleship?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db-data:

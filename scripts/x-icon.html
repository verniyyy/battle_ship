<!doctype html>
<!-- Source of docs/x/icon.png (the X avatar, 400x400). Regenerate with `just x-images`.
     X crops it to a circle, so the ring and the face stay inside the inscribed circle. -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="kv.css" />
    <style>
      :root {
        --horizon: 78%;
        --sun-x: 50%;
      }
      html,
      body {
        width: 400px;
        height: 400px;
      }
      .crew .front {
        left: -392px;
        top: -84px;
        height: 1700px;
      }
      .ring {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        border: 2px solid rgba(244, 198, 90, 0.85);
        box-shadow: inset 0 0 0 5px rgba(5, 12, 24, 0.6), inset 0 0 0 6px rgba(244, 198, 90, 0.4), 0 0 18px rgba(244, 198, 90, 0.35);
      }
      .vignette {
        background: radial-gradient(circle at 50% 46%, transparent 52%, rgba(2, 6, 14, 0.7) 72%);
      }
    </style>
  </head>
  <body>
    <div class="layer sky"></div>
    <div class="layer sea"></div>
    <div class="layer horizon-line"></div>
    <div class="layer rays"></div>
    <div class="layer crew">
      <img class="front" src="../frontend/public/portraits/bb_amaterasu.webp" />
    </div>
    <div class="layer embers" data-count="10" data-area="40 40 320 320"></div>
    <div class="layer vignette"></div>
    <div class="ring"></div>
    <script src="kv.js"></script>
  </body>
</html>

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Asset-pack manifests change on every import; files they list carry a
    # ?v= content hash, so only the manifests need revalidating.
    location ~ /manifest\.json$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Optional legacy assets: a missing file must be a real 404, not the SPA shell.
    location /legacy/ {
        try_files $uri =404;
        expires 7d;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The SPA shell names the current hashed bundles; revalidate it so a
    # rebuild shows up on the next load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

name: backend

# Pull requests run this through ci.yml, which always reports the required check.
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_call:
  workflow_dispatch:

concurrency:
  # Named literally: under ci.yml, github.workflow would be "ci" for every called workflow.
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # A scratch database so the store integration tests run instead of skipping.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: battleship
          POSTGRES_PASSWORD: battleship
          POSTGRES_DB: battleship_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U battleship -d battleship_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://battleship:battleship@localhost:5432/battleship_test?sslmode=disable

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

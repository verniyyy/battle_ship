name: web

on:
  push:
    paths: ["frontend/**", "edge/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["frontend/**", "edge/**", ".github/workflows/web.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc -b and vite build. Portraits are not in git, so this checks code only.
      - run: npm run build

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # wrangler is not a dependency (the devshell provides it), so fetch it here
      # to generate worker-configuration.d.ts from wrangler.jsonc. The secret's
      # type comes from .dev.vars (not in git), so give it a placeholder.
      - run: |
          echo 'ORIGIN_SECRET=ci-placeholder' > .dev.vars
          bun x wrangler@4 types
      - run: bun x tsc --noEmit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
